# This rule is not used by the project manifestation-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over manifestation.pez.sh.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: manifestation-operator
    app.kubernetes.io/managed-by: kustomize
  name: desire-admin-role
rules:
- apiGroups:
  - manifestation.pez.sh
  resources:
  - desires
  verbs:
  - '*'
- apiGroups:
  - manifestation.pez.sh
  resources:
  - desires/status
  verbs:
  - get
