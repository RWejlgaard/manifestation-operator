# This rule is not used by the project manifestation-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the manifestation.pez.sh.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: manifestation-operator
    app.kubernetes.io/managed-by: kustomize
  name: desire-editor-role
rules:
- apiGroups:
  - manifestation.pez.sh
  resources:
  - desires
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - manifestation.pez.sh
  resources:
  - desires/status
  verbs:
  - get
