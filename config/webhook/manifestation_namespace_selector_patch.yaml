# Gate pods in EVERY namespace, except the control-plane and supporting namespaces. If
# those were gated, the cluster's own plumbing (and this operator) would never schedule
# and nothing could ever ungate anything. The operator pod also self-skips via the
# manifestation.pez.sh/skip label as defense in depth.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- name: mpod-v1.kb.io
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
          - kube-system
          - kube-node-lease
          - kube-public
          - cert-manager
          - manifestation-operator-system
