# Limit the pod mutating webhook to namespaces that opted into manifestation. Without
# this, every pod in the cluster would be born into limbo (funny once, then an incident).
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- name: mpod-v1.kb.io
  namespaceSelector:
    matchLabels:
      manifestation.pez.sh/enabled: "true"
